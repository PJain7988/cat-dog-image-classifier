<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat vs Dog Classifier</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 500px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
        }
        input[type="file"] {
            margin: 20px 0;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        #preview {
            max-width: 100%;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        .error {
            color: #e74c3c;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐾 Cat vs Dog Classifier</h1>
        <p>Upload an image to see if it's a cat or a dog!</p>
        
        <form id="upload-form" enctype="multipart/form-data">
            <input type="file" name="file" id="file-input" accept="image/*" required>
            <br>
            <button type="submit">Predict 🚀</button>
        </form>
        
        <img id="preview" src="#" alt="Image preview">
        
        <div id="result-container" class="result"></div>
        <div id="error-container" class="error"></div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const uploadForm = document.getElementById('upload-form');
        const resultContainer = document.getElementById('result-container');
        const errorContainer = document.getElementById('error-container');

        // Show image preview
        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    resultContainer.innerHTML = '';
                    errorContainer.innerHTML = '';
                }
                reader.readAsDataURL(file);
            }
        });

        // Handle form submission
        uploadForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            resultContainer.innerHTML = 'Analyzing...';
            errorContainer.innerHTML = '';
            
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultContainer.innerHTML = `
                        Prediction: ${data.class}<br>
                        Confidence: ${data.confidence}%
                    `;
                } else {
                    errorContainer.innerHTML = data.error || 'An error occurred during prediction.';
                    resultContainer.innerHTML = '';
                }
            } catch (error) {
                errorContainer.innerHTML = 'Network error or server is down.';
                resultContainer.innerHTML = '';
            }
        });
    </script>
</body>
</html>
